name: bentopdf

services:
  bentopdf-ui:
    image: ghcr.io/tashifkhan/bentopdf-ui:sha-e9583fa@sha256:7a7c4050da2909be1c4baee9e3aa53d5d6986aa25d1d01f020d5ea6ec4b21b61
    container_name: bentopdf-ui
    hostname: bentopdf-ui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      nginx-proxy-manager:
        aliases:
          - bentopdf-ui
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 384m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  nginx-proxy-manager:
    name: nginx-proxy-manager_nginxproxyman
    external: true
