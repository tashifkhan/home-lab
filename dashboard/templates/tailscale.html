{%- import "_ui.html" as ui -%}
<!doctype html>
<html lang="en">
<head>
    {{ ui.head("Network · arr.tashif.codes") }}
</head>

<body class="m3">
{% call ui.appbar('network', 'Network') %}
<button type="button" id="refresh" class="m3-icon-btn m3-refresh m3-state js-refresh" title="Refresh devices" aria-label="Refresh devices">
    {{ ui.icon('refresh', 'w-[22px] h-[22px]') }}{{ ui.loader(label="Refreshing") }}
</button>
{% endcall %}

<div class="m3-page">
    <section class="m3-hero">
        <h1 class="m3-display">Network</h1>
        <div id="hero-pills" class="flex flex-wrap items-center gap-2 mt-5 min-h-8"></div>
    </section>

    <main id="devices" aria-busy="true" aria-live="polite">
        <div class="m3-loading-block">
            {{ ui.loader() }}
            <span class="m3-body m3-variant">Asking Tailscale for devices…</span>
        </div>
    </main>
</div>

<button type="button" class="m3-fab m3-refresh m3-state js-refresh" title="Refresh devices" aria-label="Refresh devices">
    {{ ui.icon('refresh', 'w-6 h-6') }}{{ ui.loader(label="Refreshing") }}
</button>

{{ ui.navbar('network') }}

<script>
(() => {
    const box = document.getElementById("devices");
    const pills = document.getElementById("hero-pills");
    const CHECK = '{{ ui.icon("check", "w-[18px] h-[18px]") | replace("\n", "") }}';
    let timer;

    // Same action from the app bar button (wide screens) and the FAB (phones).
    const btns = document.querySelectorAll(".js-refresh");
    let busy = false;

    async function load(fresh = false) {
        clearTimeout(timer);
        let ttl = 60;
        try {
            const r = await fetch("/tailscale/devices" + (fresh ? "?fresh=1" : ""), { headers: { Accept: "text/html" } });
            if (r.status === 401) { location.href = "/login?next=/tailscale"; return; }
            ttl = +r.headers.get("X-Refresh-After") || ttl;
            box.innerHTML = await r.text();
        } catch {
            if (box.getAttribute("aria-busy") === "true") {
                box.innerHTML = '<p class="m3-body m3-variant text-center py-10">Could not reach the dashboard. Retrying…</p>';
            }
            ttl = 10;
        }
        box.setAttribute("aria-busy", "false");
        const summary = box.querySelector("#devices-summary");
        pills.innerHTML = summary ? summary.innerHTML : "";
        box.querySelectorAll(".js-checked").forEach(el => {
            el.textContent = "Checked " + new Date(el.dataset.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        });
        timer = setTimeout(load, (ttl + 2) * 1000);
    }

    async function refresh() {
        if (busy) return;
        busy = true;
        btns.forEach(b => { b.classList.add("is-busy"); b.setAttribute("aria-busy", "true"); });
        document.documentElement.classList.add("is-refreshing");
        // Hold the loader at least 700ms so a fast reply still reads as a refresh.
        await Promise.all([load(true), new Promise(r => setTimeout(r, 700))]);
        document.documentElement.classList.remove("is-refreshing");
        btns.forEach(b => { b.classList.remove("is-busy"); b.removeAttribute("aria-busy"); });
        busy = false;
        if (window.m3Snackbar) m3Snackbar("Devices updated");
    }
    btns.forEach(b => b.addEventListener("click", refresh));

    window.copyIP = (btn, ip) => {
        navigator.clipboard.writeText(ip).then(() => {
            const orig = btn.innerHTML;
            btn.innerHTML = CHECK;
            if (window.m3Snackbar) m3Snackbar("Copied " + ip);
            setTimeout(() => { btn.innerHTML = orig; }, 1500);
        });
    };

    load();
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy) load(); });
})();
</script>
</body>
</html>
