<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · arr.tashif.codes</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512x512.png?v=3" />
  <link rel="manifest" href="/manifest.webmanifest?v=3" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Home Lab" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=3" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Geist", "system-ui", "-apple-system", "sans-serif"],
            mono: ["JetBrains Mono", "Geist Mono", "monospace"],
            papyrus: ["Papyrus", "Segoe Print", "Bradley Hand", "fantasy"],
          },
          colors: {
            bg: "#0a0a0b",
            card: "#131316",
            line: "#232326",
            "line-strong": "#2c2c32",
            accent: "#e8a040",
          },
        },
      },
    }
  </script>
    <link rel="stylesheet" href="/static/transitions.css?v=2" />
</head>

<body class="bg-bg text-zinc-100 font-papyrus antialiased min-h-screen flex flex-col">

  <nav class="max-w-[1160px] w-full mx-auto px-4 sm:px-6 lg:px-8 flex items-center h-[56px] border-b border-line">
    <a href="/" class="flex items-center gap-2.5 no-underline shrink-0 group">
      <span class="w-5 h-5 flex items-center justify-center shrink-0 text-zinc-400 group-hover:text-accent transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="5" rx="1.4"/>
          <rect x="3" y="9.5" width="18" height="5" rx="1.4"/>
          <rect x="3" y="16" width="18" height="5" rx="1.4"/>
          <circle cx="7" cy="5.5" r="0.9" fill="currentColor" stroke="none"/>
          <circle cx="7" cy="12" r="0.9" fill="currentColor" stroke="none"/>
          <circle cx="7" cy="18.5" r="0.9" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="flex items-baseline gap-1.5 leading-none">
        <span class="text-[15px] font-bold tracking-tight leading-none">arr.tashif.codes</span>
        <span class="text-[12px] font-papyrus text-zinc-500 leading-none">home lab</span>
      </span>
    </a>
  </nav>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[400px]">

      <div class="mb-8">
        <div class="inline-flex items-center gap-2 text-[11px] font-papyrus font-semibold tracking-widest uppercase text-zinc-400 mb-3">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Private access
        </div>
        <h1 class="text-[30px] font-bold tracking-tight leading-none">Sign in to <span class="text-accent">arr.tashif</span>.codes</h1>
        <p class="text-[13px] leading-relaxed text-zinc-400 mt-3">This dashboard is only available on your tailnet. Enter the password to continue.</p>
      </div>

      <div class="bg-card border border-line p-6 rounded-xl">
        {% if error %}
        <div class="flex items-center gap-2 mb-4 px-3.5 py-3 rounded-lg border border-red-500/25 bg-red-500/10 text-red-300 text-[13px] leading-snug">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="flex flex-col gap-4">
          <input type="hidden" name="next" value="{{ next | default('/', true) }}" />
          <label class="flex flex-col gap-1.5">
            <span class="text-[11px] font-semibold tracking-widest uppercase text-zinc-300">Password</span>
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                autofocus
                required
                placeholder="Enter password"
                class="w-full bg-bg border border-line focus:border-accent/40 focus:outline-none focus:ring-2 focus:ring-accent/20 text-[14px] text-white placeholder-zinc-500 px-3.5 py-3 pr-11 rounded-lg transition-colors"
                style="font-size:16px"
              >
              <button id="pw-toggle" type="button" aria-label="Toggle password visibility"
                class="absolute right-0 top-0 bottom-0 px-3.5 flex items-center text-zinc-500 hover:text-zinc-300 transition-colors">
                <svg id="icon-eye" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="icon-eye-off" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </label>

          <button type="submit"
            class="w-full py-3 rounded-lg bg-accent text-black text-[14px] font-bold tracking-wide hover:bg-[#f0a84a] active:bg-[#d8943a] transition-colors">
            Sign in
          </button>
        </form>
      </div>

      <p class="text-center text-[12px] font-papyrus text-zinc-500 mt-6">Docker · Tailscale · Cloudflare Tunnel</p>
    </div>
  </div>

<script>
  const toggle = document.getElementById('pw-toggle');
  const input  = document.getElementById('password');
  const eyeOn  = document.getElementById('icon-eye');
  const eyeOff = document.getElementById('icon-eye-off');
  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eyeOn.classList.toggle('hidden', show);
    eyeOff.classList.toggle('hidden', !show);
  });
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch(err => console.debug('SW registration error:', err));
    });
}
</script>
</body>
</html>
