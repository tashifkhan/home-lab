; Persistent PHP performance overrides copied to ${CLOUD_PATH}/config/php.

date.timezone = Asia/Kolkata

; APCu is Nextcloud's fast in-process cache. CLI support lets cron use it too.
apc.enable_cli = 1
apc.shm_size = 128M

; Leave enough room for Nextcloud and installed apps without OPcache churn.
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 32

realpath_cache_size = 16M
realpath_cache_ttl = 600
