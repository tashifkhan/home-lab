map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# api.js is a static, versioned Office SDK entry point. The upstream marks it
# no-store for safety, but it contains no per-document data; cache it briefly
# here (and at Cloudflare) so every editor open does not pay an origin round trip.
proxy_cache_path /var/cache/nginx/office levels=1:2 keys_zone=office_api:2m
                 max_size=32m inactive=10m use_temp_path=off;

server {
    listen 443 ssl;
    http2 on;
    server_name office.taf.sh;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Buffer normal document-server responses so large immutable editor assets
    # can stream efficiently through the VPS proxy. Nginx automatically bypasses
    # response buffering for upgraded WebSocket connections.
    proxy_buffering on;
    proxy_buffers 32 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 0;

    location = /web-apps/apps/api/documents/api.js {
        proxy_pass http://euro-office:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache office_api;
        proxy_cache_key "$scheme://$host$uri";
        proxy_cache_lock on;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=60" always;
    }

    location / {
        proxy_pass http://euro-office:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
