services:
  searxng:
    # Updated 2026-10-24. Keep a tested digest after engine smoke tests.
    image: searxng/searxng@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
    container_name: searxng
    hostname: searxng
    restart: unless-stopped
    ports:
      - 4212:8080
    volumes:
      - ${SEARXNG_PATH}/settings.yml:/etc/searxng/settings.yml:ro
      - ${SEARXNG_PATH}/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=https://search.taf.sh/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - TZ=${TIME_ZONE}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      valkey:
        condition: service_healthy
    env_file:
      - '.env'

  valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    hostname: valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ${SEARXNG_PATH}/redis:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
