use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "SearXNG"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"
  ban_time_on_fail: 30
  max_ban_time_on_fail: 300
  formats:
    - html
    - json
    - csv
    - rss

server:
  secret_key: "${SEARXNG_SECRET}"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: "https://search.taf.sh/"
  image_proxy: true
  limiter: true
  public_instance: true
  method: "GET"

valkey:
  url: valkey://valkey:6379/0

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: ""
  query_in_title: true
  infinite_scroll: true
  center_alignment: false
  results_on_new_tab: false
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 4
  max_request_timeout: 6
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # General search favors providers that passed the September 2026 audit.
  # Google CSE adds coverage, but shares Google's index, so keep its weight at 1.
  - name: google
    engine: google
    shortcut: go
    inactive: false
    weight: 2.0
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    weight: 2.0
    disabled: true

  - name: brave
    engine: brave
    shortcut: br
    weight: 1.5
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    weight: 1.0
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    weight: 0.75
    disabled: true

  - name: google cse
    engine: google_cse
    shortcut: g
    weight: 1.0
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: arxiv
    engine: arxiv
    shortcut: ar
    disabled: false

  - name: docker hub
    engine: docker_hub
    shortcut: dh
    disabled: false

  - name: pypi
    engine: pypi
    shortcut: py
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: true

  - name: marginalia
    engine: marginalia
    shortcut: mg
    disabled: true

  - name: wiby
    engine: json_engine
    shortcut: wib
    disabled: false
    categories: [discovery, blogs]

  - name: yep
    engine: yep
    shortcut: yp
    disabled: true

  # The SPARQL endpoint rejected initialization from this server.
  - name: wikidata
    disabled: true
    inactive: true

  # Other video providers returned results; Vimeo returned an HTTP error.
  - name: vimeo
    disabled: true

  # Small indexes and direct community sources, isolated from general ranking.
  - name: mwmbl
    disabled: false
    categories: [discovery]
    timeout: 6

  - name: hackernews
    disabled: false
    categories: [discovery, it]

  - name: lemmy posts
    disabled: false
    categories: [discovery, social media]
    timeout: 6

  - name: odysee
    disabled: false
    categories: [discovery, videos]
    timeout: 6

  - name: sepiasearch
    disabled: false
    categories: [discovery, videos]

categories_as_tabs:
  general:
  discovery:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:
