services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    platform: linux/amd64
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - ${ARR_PATH}/config/prowlarr:/config
      - ${ARR_PATH}/backup/prowlarr:/data/Backup
      - ${ARR_PATH}/downloads:/downloads
    ports:
      - 4204:9696
    restart: unless-stopped
    env_file:
      - '.env'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Asia/Kolkata
    ports:
      - 8191:8191
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    platform: linux/amd64
    container_name: sonarr
    hostname: sonarr
    volumes:
      - ${ARR_PATH}/config/sonarr:/config
      - ${ARR_PATH}/backup/sonarr:/data/Backup
      - ${ARR_PATH}/shows:/data/tvshows
      - ${ARR_PATH}/downloads:/downloads
    ports:
      - 4205:8989
    restart: unless-stopped
    env_file:
      - '.env'

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    platform: linux/amd64
    container_name: radarr
    hostname: radarr
    volumes:
      - ${ARR_PATH}/config/radarr:/config
      - ${ARR_PATH}/movies:/data/movies
      - ${ARR_PATH}/backup/radarr:/data/Backup
      - ${ARR_PATH}/downloads:/downloads
    ports:
      - 4206:7878
    restart: unless-stopped
    env_file:
      - '.env'

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    platform: linux/amd64
    container_name: lidarr
    hostname: lidarr
    volumes:
      - ${ARR_PATH}/config/lidarr:/config
      - ${ARR_PATH}/music:/data/musicfolder
      - ${ARR_PATH}/downloads:/downloads
    ports:
      - 4207:8686
    restart: unless-stopped
    env_file:
      - '.env'

  readarr:
    image: hotio/readarr:latest
    container_name: readarr
    hostname: readarr
    volumes:
      - ${ARR_PATH}/config/readarr:/config
      - ${ARR_PATH}/books:/data/books
      - ${ARR_PATH}/downloads:/downloads
    ports:
      - 4208:8787
    restart: unless-stopped
    env_file:
      - '.env'

  homarr:
    container_name: homarr
    # Homarr 1.x needs an explicit export/import migration from 0.15.x.
    # Keep the legacy dashboard on the final 0.x release until that is done.
    image: ghcr.io/ajnart/homarr:0.15.10
    restart: unless-stopped
    volumes:
      - ${ARR_PATH}/configs/homarr:/app/data/configs
      - ${ARR_PATH}/icons/homarr:/app/public/icons
      - ${ARR_PATH}/data/homarr:/data
    ports:
      - '4209:7575'
    env_file:
      - '.env'

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - ${ARR_PATH}/config/qbittorrent:/config
      - ${ARR_PATH}/downloads:/downloads
    ports:
      - 4203:8080
      - 6881:6881
      - 6881:6881/udp
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881

    healthcheck:
      start_period: 15s

    env_file:
      - '.env'

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    hostname: tdarr
    ports:
      - '4210:8265' # Tdarr web interface
      - '4211:8266' # Tdarr server port used by external nodes
    volumes:
      - ${ARR_PATH}/config/tdarr/server:/app/server
      - ${ARR_PATH}/config/tdarr/configs:/app/configs
      - ${ARR_PATH}/config/tdarr/logs:/app/logs
      - ${ARR_PATH}/movies:/media/movies
      - ${ARR_PATH}/shows:/media/shows
      - ${TDARR_TRANSCODE_CACHE}:/temp
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=${UMASK_SET}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false
      - inContainer=true
      - ffmpegVersion=6
    env_file:
      - '.env'
    restart: unless-stopped

  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node
    hostname: tdarr-node
    volumes:
      - ${ARR_PATH}/config/tdarr/configs:/app/configs
      - ${ARR_PATH}/config/tdarr/logs:/app/logs
      - ${ARR_PATH}/movies:/media/movies
      - ${ARR_PATH}/shows:/media/shows
      - ${TDARR_TRANSCODE_CACHE}:/temp
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=${UMASK_SET}
      - nodeName=tdarr-node-main
      - nodeID=tdarr-node-main
      - serverIP=tdarr
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=6
    env_file:
      - '.env'
    depends_on:
      - tdarr
    restart: unless-stopped
